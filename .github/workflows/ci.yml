name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserAPI
          path: TesserAPI
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build -DTESSERAPI_DIR="$PWD/TesserAPI"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Fixtures are up to date
        run: |
          ./build/tesserui_fixtures fixtures
          git diff --exit-code -- fixtures
      # The LVGL renderer's pages of the demo tree, for review.
      - name: LCD screenshots
        run: mkdir -p lcd-shots && ./build/tesserui_lcd demo --shots lcd-shots
      - uses: actions/upload-artifact@v4
        with:
          name: lcd-shots
          path: lcd-shots

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.1, release-v5.4, release-v5.5, latest]
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v5
      # Inside the workspace, so the build container sees it.
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserAPI
          path: TesserAPI
      - uses: actions/checkout@v5
        with:
          repository: leokeba/NowTP
          path: NowTP
      - name: Build the ESP-IDF examples
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/idf
          # Paths relative to each example's directory. lcd_local and lcd_remote
          # are made for a classic ESP32 board (its pins).
          command: |
            for e in self_hosted bluetooth usb_gateway ${{ matrix.target == 'esp32' && 'lcd_local lcd_remote' || '' }}; do
              TESSERAPI_PATH=../../../TesserAPI NOWTP_PATH=../../../NowTP idf.py -C $e -B $e/build build || exit 1
            done
            # The remote for the LilyGO T-Display too (two buttons, no touch).
            # SDKCONFIG is relative to the example folder unless absolute. No
            # apostrophes in this command: the action runs it inside bash -c.
            if [ "${{ matrix.target }}" = esp32 ]; then
              TESSERAPI_PATH=../../../TesserAPI NOWTP_PATH=../../../NowTP idf.py -C lcd_remote -B lcd_remote/build-tdisplay \
                -DBOARD=tdisplay -DSDKCONFIG="$PWD/lcd_remote/build-tdisplay/sdkconfig" build || exit 1
            fi

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["3.3.7"]
        fqbn: ["esp32:esp32:esp32", "esp32:esp32:esp32c3"]
    steps:
      - uses: actions/checkout@v5
      # The smaller examples, with the default partitions.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: |
            - examples/arduino/CustomWidget
            - examples/arduino/SelfHosted
            - examples/arduino/Stub
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson
      # A UI host is the board with spare flash: about 1.36 MB on the C3, past
      # the default 1.25 MB app partition. Minimal SPIFFS keeps OTA. The NowTP
      # node and the USB gateway passed 1.25 MB on the C3 too (1.32 MB,
      # 2026-10-21, NowTP's time-reference election).
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}:PartitionScheme=min_spiffs
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: |
            - examples/arduino/UiHost
            - examples/arduino/NowTpNode
            - examples/arduino/UsbGateway
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson
      # Bluedroid makes the ESP32 build about 1.7 MB: a larger app partition.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}${{ matrix.fqbn == 'esp32:esp32:esp32' && ':PartitionScheme=huge_app' || '' }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino/Bluetooth
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson
      # Classic Bluetooth: the ESP32 only, with a larger app partition too.
      - if: matrix.fqbn == 'esp32:esp32:esp32'
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino/BluetoothSerial
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserAPI
          path: TesserAPI
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types and accessibility
        run: pnpm check
      - name: Model and store tests
        run: pnpm test
      - name: Bundle within budget (65 KB gzipped, 70 KB with its chunk)
        run: pnpm build
      - name: Generated files are up to date (bundle header, embedded element)
        run: git diff --exit-code -- ../src/tesserui/bundle/tesserui_bundle.h ../examples/arduino/CustomWidget/sun_dial.h
      - name: Host demo device
        working-directory: .
        run: |
          cmake -S . -B build -DTESSERAPI_DIR="$PWD/TesserAPI"
          cmake --build build -j --target tesserui_demo
      - name: The bridge (mDNS codec tests; the end-to-end tests start it)
        working-directory: bridge
        run: pnpm install --frozen-lockfile && pnpm test
      - name: End-to-end tests against the demo device
        run: |
          npx playwright install --with-deps chromium
          pnpm e2e
      # The launcher on GitHub Pages (DESIGN.md §9.7): the bundle that just
      # passed and the flasher, from main only, built again with a
      # placeholder for the version the release takes, which the pages job
      # stamps in (scripts/site.mjs) with the firmware and the versions.
      - name: Pages site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TESSERUI_VERSION=0.0.0-site pnpm build
          mkdir -p _site/ui && cp pages/index.html dist/ui.js dist/launcher.js _site/ && cp dist/ui/*.js _site/ui/ && cp -R dist/flash _site/flash
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: site
          path: web/_site
          retention-days: 1

  # Each push to main that passes: a release of the ESP-IDF examples a board
  # runs as they are, which the launcher installs (DESIGN.md §9.7.1). The
  # self-hosted example isn't one: its Wi-Fi network is built in. TesserKIT's
  # reusable workflow numbers the release (a patch, unless a commit since the
  # last tag says "Release: minor" or "Release: major", DESIGN.md §12),
  # builds each chip's images, and tags a commit on top of this one stating
  # the version in every file (stamp-command), never pushed to main.
  firmware:
    needs: [host-tests, esp-idf, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # One release at a time, so two pushes never take the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      projects: |
        [{"project": "examples/idf/usb_gateway", "name": "tesserui-usb-gateway"},
         {"project": "examples/idf/bluetooth", "name": "tesserui-bluetooth"}]
      targets: '["esp32", "esp32c3", "esp32s3"]'
      stamp-command: node web/scripts/version.mjs "$VERSION"
      dependencies: |
        leokeba/TesserAPI
        leokeba/NowTP

  # The bridge as a macOS executable for each architecture, with this
  # launcher built in (bridge.yml), on the release the firmware job made.
  # The launcher links to the latest release's.
  bridge:
    needs: [web, firmware]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/bridge.yml
    with:
      page: web/pages/index.html
      name: tesserui-bridge
      tag: v${{ needs.firmware.outputs.version }}
      tesserui-ref: ${{ github.sha }}

  # The site, with the latest three releases' images copied in: a page can't
  # read release assets from GitHub (no CORS). And every released version of
  # the bundle at v<version>/, for stub pages pinned to one (DESIGN.md §9.6):
  # this release's is attached to it, the earlier ones read back from theirs.
  # Deployed even when a release failed, with the releases there are.
  pages:
    needs: [web, firmware]
    if: ${{ !cancelled() && needs.web.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: The firmware the launcher installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/firmware.mjs "$GITHUB_REPOSITORY" _site/firmware --releases 3
      # Only a release of this very commit gets a folder: one that failed, or
      # that a newer push superseded, leaves the bundle saying package.json's
      # version. The tag is on this commit, or on the release commit made on
      # top of it that states the version (DESIGN.md §12).
      - name: The bundle's versions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          git fetch -q --tags
          # No tag yet (a superseded release never made it): no version,
          # rather than ending the step (bash -e).
          tagged=$(git rev-parse -q --verify "v$VERSION^{commit}" || true)
          if [ -z "$VERSION" ] || { [ "$tagged" != "$GITHUB_SHA" ] && [ "$(git rev-parse -q --verify "$tagged^")" != "$GITHUB_SHA" ]; } || ! gh release view "v$VERSION" > /dev/null; then
            VERSION=
          fi
          node web/scripts/site.mjs _site --repo "$GITHUB_REPOSITORY" ${VERSION:+--version "$VERSION" --pack "tesserui-web-$VERSION.tar.gz"}
          if [ -n "$VERSION" ]; then gh release upload "v$VERSION" "tesserui-web-$VERSION.tar.gz" --clobber; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
