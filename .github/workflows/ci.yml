name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserAPI
          path: TesserAPI
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build -DTESSERAPI_DIR="$PWD/TesserAPI"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Fixtures are up to date
        run: |
          ./build/tesserui_fixtures fixtures
          git diff --exit-code -- fixtures

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.1, release-v5.4, release-v5.5, latest]
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v5
      # Inside the workspace, so the build container sees it.
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserAPI
          path: TesserAPI
      - uses: actions/checkout@v5
        with:
          repository: leokeba/NowTP
          path: NowTP
      - name: Build the ESP-IDF examples
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/idf
          # Paths relative to each example's directory.
          command: |
            for e in self_hosted bluetooth usb_gateway; do
              TESSERAPI_PATH=../../../TesserAPI NOWTP_PATH=../../../NowTP idf.py -C $e -B $e/build build || exit 1
            done

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["3.3.7"]
        fqbn: ["esp32:esp32:esp32", "esp32:esp32:esp32c3"]
    steps:
      - uses: actions/checkout@v5
      # Every example but the UI host and Bluetooth, with the default partitions.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: |
            - examples/arduino/CustomWidget
            - examples/arduino/NowTpNode
            - examples/arduino/SelfHosted
            - examples/arduino/Stub
            - examples/arduino/UsbGateway
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson
      # A UI host is the board with spare flash: about 1.36 MB on the C3, past
      # the default 1.25 MB app partition. Minimal SPIFFS keeps OTA.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}:PartitionScheme=min_spiffs
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino/UiHost
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson
      # Bluedroid makes the ESP32 build about 1.7 MB: a larger app partition.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}${{ matrix.fqbn == 'esp32:esp32:esp32' && ':PartitionScheme=huge_app' || '' }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino/Bluetooth
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson
      # Classic Bluetooth: the ESP32 only, with a larger app partition too.
      - if: matrix.fqbn == 'esp32:esp32:esp32'
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino/BluetoothSerial
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
            - source-url: https://github.com/leokeba/NowTP.git
            - name: ArduinoJson

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserAPI
          path: TesserAPI
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types and accessibility
        run: pnpm check
      - name: Model and store tests
        run: pnpm test
      - name: Bundle within budget (59.5 KB gzipped)
        run: pnpm build
      - name: Generated files are up to date (bundle header, embedded element)
        run: git diff --exit-code -- ../src/tesserui/bundle/tesserui_bundle.h ../examples/arduino/CustomWidget/sun_dial.h
      - name: Host demo device
        working-directory: .
        run: |
          cmake -S . -B build -DTESSERAPI_DIR="$PWD/TesserAPI"
          cmake --build build -j --target tesserui_demo
      - name: The bridge (mDNS codec tests; the end-to-end tests start it)
        working-directory: bridge
        run: pnpm install --frozen-lockfile && pnpm test
      - name: End-to-end tests against the demo device
        run: |
          npx playwright install --with-deps chromium
          pnpm e2e
      # The launcher on GitHub Pages (DESIGN.md §9.7): the bundle that just
      # passed and the flasher, from main only. The pages job adds the
      # firmware.
      - name: Pages site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mkdir -p _site && cp pages/index.html dist/ui.js _site/ && cp -R dist/flash _site/flash
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: site
          path: web/_site
          retention-days: 1

  # Each push to main that passes: a release of the ESP-IDF examples a board
  # runs as they are, which the launcher installs (DESIGN.md §9.7.1). The
  # self-hosted example isn't one: its Wi-Fi network is built in. TesserKIT's
  # reusable workflow numbers the release (library.json's version at least)
  # and builds each chip's images.
  firmware:
    needs: [host-tests, esp-idf, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # One release at a time, so two pushes never take the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      projects: |
        [{"project": "examples/idf/usb_gateway", "name": "tesserui-usb-gateway"},
         {"project": "examples/idf/bluetooth", "name": "tesserui-bluetooth"}]
      targets: '["esp32", "esp32c3", "esp32s3"]'
      version-command: jq -r .version library.json
      dependencies: |
        leokeba/TesserAPI
        leokeba/NowTP

  # The site, with the latest three releases' images copied in: a page can't
  # read release assets from GitHub (no CORS). Deployed even when a release
  # failed, with the releases there are.
  pages:
    needs: [web, firmware]
    if: ${{ !cancelled() && needs.web.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: The firmware the launcher installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/firmware.mjs "$GITHUB_REPOSITORY" _site/firmware --releases 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
