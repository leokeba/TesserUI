name=TesserUI
version=0.2.6
author=Leo Baque
maintainer=Leo Baque
sentence=User interfaces for TesserAPI nodes, rendered from their schema.
paragraph=Serves a web UI from the node (one gzipped bundle compiled into the firmware), or a 300-byte stub page that loads it from a CDN or a UI host, and declares dashboard views combining values from several nodes. Every TesserAPI node gets a usable interface from its schema and presentation hints, without UI code. For ESP32 under Arduino and ESP-IDF.
category=Display
